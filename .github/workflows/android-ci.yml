# Runs on every push and pull request: if the core app tests, lint or the debug
# build fail, the commit is marked red and should not be merged.
name: Android CI

on:
  push:
    paths: ["frontend/**", ".github/workflows/android-ci.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/android-ci.yml"]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit and Robolectric tests
        run: ./gradlew --no-configuration-cache :app:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-configuration-cache :app:lintDebug

      - name: Debug build
        run: ./gradlew --no-configuration-cache :app:assembleDebug

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            frontend/app/build/reports/tests/
            frontend/app/build/reports/lint-results-debug.html
