services:

  # ============================================================
  # MAIN BACKEND
  # ============================================================

  votingbackend3:
    build:
      context: .
      dockerfile: votingBackend3/Dockerfile
    container_name: votingbackend3
    restart: unless-stopped
    init: true

    ports:
      - "5000:8080"

    environment:
      NODE_ROLE: main
      ConnectionStrings__MainDatabase: "${MainDbConnection}"
      JWTKey: "${JWTKey}"
      Issuer: "${Issuer}"
      Audience: "${Audience}"
      ExpirationMinutes: "${ExpirationMinutes}"
      NodeAuth__Issuer: VotingBackend
      NodeAuth__Audience: BlockchainNodes
      NodeAuth__SigningKey: "${NODE_AUTH_SIGNING_KEY}"

    volumes:
      - VotingDocuments:/app/VotingDocuments

    depends_on:
      db_main:
        condition: service_healthy
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy
      node4:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s


  # ============================================================
  # BLOCKCHAIN NODES
  # ============================================================

  node1:
    build:
      context: .
      dockerfile: votingBackend3/Dockerfile
    container_name: node1
    restart: unless-stopped
    init: true

    environment:
      NODE_ROLE: node
      NODE_ID: 1
      ConnectionStrings__MainDatabase: "${MainDbConnection}"
      ConnectionStrings__BlockchainDatabase: "Host=db_node1;Port=5432;Database=node1_db;Username=postgres;Password=${PostgresPassword}"
      JWTKey: "${JWTKey}"
      Issuer: "${Issuer}"
      Audience: "${Audience}"
      ExpirationMinutes: "${ExpirationMinutes}"
      NodeAuth__Issuer: VotingBackend
      NodeAuth__Audience: BlockchainNodes
      NodeAuth__SigningKey: "${NODE_AUTH_SIGNING_KEY}"

    depends_on:
      db_main:
        condition: service_healthy
      db_node1:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s


  node2:
    build:
      context: .
      dockerfile: votingBackend3/Dockerfile
    container_name: node2
    restart: unless-stopped
    init: true

    environment:
      NODE_ROLE: node
      NODE_ID: 2
      ConnectionStrings__MainDatabase: "${MainDbConnection}"
      ConnectionStrings__BlockchainDatabase: "Host=db_node2;Port=5432;Database=node2_db;Username=postgres;Password=${PostgresPassword}"
      JWTKey: "${JWTKey}"
      Issuer: "${Issuer}"
      Audience: "${Audience}"
      ExpirationMinutes: "${ExpirationMinutes}"
      NodeAuth__Issuer: VotingBackend
      NodeAuth__Audience: BlockchainNodes
      NodeAuth__SigningKey: "${NODE_AUTH_SIGNING_KEY}"

    depends_on:
      db_main:
        condition: service_healthy
      db_node2:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s


  node3:
    build:
      context: .
      dockerfile: votingBackend3/Dockerfile
    container_name: node3
    restart: unless-stopped
    init: true

    environment:
      NODE_ROLE: node
      NODE_ID: 3
      ConnectionStrings__MainDatabase: "${MainDbConnection}"
      ConnectionStrings__BlockchainDatabase: "Host=db_node3;Port=5432;Database=node3_db;Username=postgres;Password=${PostgresPassword}"
      JWTKey: "${JWTKey}"
      Issuer: "${Issuer}"
      Audience: "${Audience}"
      ExpirationMinutes: "${ExpirationMinutes}"
      NodeAuth__Issuer: VotingBackend
      NodeAuth__Audience: BlockchainNodes
      NodeAuth__SigningKey: "${NODE_AUTH_SIGNING_KEY}"

    depends_on:
      db_main:
        condition: service_healthy
      db_node3:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s


  node4:
    build:
      context: .
      dockerfile: votingBackend3/Dockerfile
    container_name: node4
    restart: unless-stopped
    init: true

    environment:
      NODE_ROLE: node
      NODE_ID: 4
      ConnectionStrings__MainDatabase: "${MainDbConnection}"
      ConnectionStrings__BlockchainDatabase: "Host=db_node4;Port=5432;Database=node4_db;Username=postgres;Password=${PostgresPassword}"
      JWTKey: "${JWTKey}"
      Issuer: "${Issuer}"
      Audience: "${Audience}"
      ExpirationMinutes: "${ExpirationMinutes}"
      NodeAuth__Issuer: VotingBackend
      NodeAuth__Audience: BlockchainNodes
      NodeAuth__SigningKey: "${NODE_AUTH_SIGNING_KEY}"

    depends_on:
      db_main:
        condition: service_healthy
      db_node4:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s


  # ============================================================
  # MAIN DATABASE
  # ============================================================

  db_main:
    image: postgres:18
    container_name: db_main
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PostgresPassword}"
      POSTGRES_DB: main_db

    ports:
      - "7045:5432"

    volumes:
      - main_db_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d main_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ============================================================
  # NODE 1 DATABASE
  # ============================================================

  db_node1:
    image: postgres:18
    container_name: db_node1
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PostgresPassword}"
      POSTGRES_DB: node1_db

    ports:
      - "7051:5432"

    volumes:
      - node1_db_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d node1_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ============================================================
  # NODE 2 DATABASE
  # ============================================================

  db_node2:
    image: postgres:18
    container_name: db_node2
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PostgresPassword}"
      POSTGRES_DB: node2_db

    ports:
      - "7052:5432"

    volumes:
      - node2_db_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d node2_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ============================================================
  # NODE 3 DATABASE
  # ============================================================

  db_node3:
    image: postgres:18
    container_name: db_node3
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PostgresPassword}"
      POSTGRES_DB: node3_db

    ports:
      - "7053:5432"

    volumes:
      - node3_db_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d node3_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s


  # ============================================================
  # NODE 4 DATABASE
  # ============================================================

  db_node4:
    image: postgres:18
    container_name: db_node4
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${PostgresPassword}"
      POSTGRES_DB: node4_db

    ports:
      - "7054:5432"

    volumes:
      - node4_db_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d node4_db"]
      interval: 10s
